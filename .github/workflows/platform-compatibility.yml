name: Desktop platform compatibility

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - compat/rust-plugin-v1/**
      - scripts/desktop-platform-evidence.py
      - scripts/package-host-portable.py
      - scripts/verify-host-portable.py
      - tests/test_desktop_platform_evidence.py
      - tests/test_host_portable.py
      - .github/workflows/platform-compatibility.yml
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - compat/rust-plugin-v1/**
      - scripts/desktop-platform-evidence.py
      - scripts/package-host-portable.py
      - scripts/verify-host-portable.py
      - tests/test_desktop_platform_evidence.py
      - tests/test_host_portable.py
      - .github/workflows/platform-compatibility.yml

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: desktop-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.name }} native contracts
    runs-on: ${{ matrix.runner }}
    # A clean Windows release build of Servo can legitimately exceed 45 minutes
    # after the test, clippy and debug smoke gates. Keep the timeout bounded, but
    # leave enough room for the production archive and unconditional cleanup.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
            platform_code: 2
            architecture_code: 1
            executable: target/debug/pam-desktop
            release_directory: target/release
            target: aarch64-apple-darwin
            python: python3
          - name: Windows x64
            runner: windows-2025
            platform_code: 3
            architecture_code: 2
            executable: target/debug/pam-desktop.exe
            release_directory: target/release
            target: x86_64-pc-windows-msvc
            python: python
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - name: Verify the supported Rust toolchain
        shell: bash
        run: rustc --version | grep -E '^rustc 1\.88\.'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-${{ matrix.platform_code }}
      - name: Validate portable gateway and plugin contracts
        run: >-
          cargo test --locked --workspace --all-targets
          --no-default-features --features gateway
      - name: Lint portable gateway and plugin contracts
        run: >-
          cargo clippy --locked --workspace --all-targets
          --no-default-features --features gateway -- -D warnings
      - name: Build and smoke-test the real Servo desktop host
        shell: bash
        run: |
          cargo build --locked -p pam-desktop --bins
          rust_version=$(rustc --version)
          '${{ matrix.python }}' scripts/desktop-platform-evidence.py create \
            --binary '${{ matrix.executable }}' \
            --platform-code '${{ matrix.platform_code }}' \
            --architecture-code '${{ matrix.architecture_code }}' \
            --revision '${{ github.sha }}' \
            --rust-version "${rust_version}" \
            --output 'desktop-platform-evidence-${{ matrix.platform_code }}.json'
          '${{ matrix.python }}' scripts/desktop-platform-evidence.py verify \
            --binary '${{ matrix.executable }}' \
            --evidence 'desktop-platform-evidence-${{ matrix.platform_code }}.json'
      - name: Build and verify the production host archive
        shell: bash
        run: |
          cargo build --locked --release -p pam-desktop --bins
          version=$(cargo metadata --no-deps --format-version 1 \
            | '${{ matrix.python }}' -c 'import json,sys; data=json.load(sys.stdin); print(next(package["version"] for package in data["packages"] if package["name"] == "pam-desktop"))')
          source_epoch=$(git log -1 --format=%ct)
          mkdir -p dist
          SOURCE_DATE_EPOCH="${source_epoch}" '${{ matrix.python }}' scripts/package-host-portable.py \
            '${{ matrix.release_directory }}' dist "${version}" '${{ matrix.target }}'
          '${{ matrix.python }}' scripts/verify-host-portable.py \
            "dist/pam-desktop-${version}-${{ matrix.target }}.tar.gz" \
            '${{ matrix.target }}'
      - uses: actions/upload-artifact@v7
        with:
          name: pam-desktop-${{ matrix.platform_code }}-native-smoke
          path: desktop-platform-evidence-${{ matrix.platform_code }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Attest the native host archive
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: pam-desktop-${{ matrix.target }}
          path: dist/pam-desktop-*
          if-no-files-found: error
          retention-days: 14
      - name: Remove build intermediates
        if: always()
        shell: bash
        run: cargo clean
