name: CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (GTK 4)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: sodium
          coverage: none
      - name: Install GTK 4, WebKitGTK 6 and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libwebkitgtk-6.0-4 gstreamer1.0-plugins-good xvfb xdotool
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Host without the optional backend features
        run: cargo check --locked -p pam-desktop-host --no-default-features
      - name: PHP package
        run: |
          composer validate --strict composer.json
          composer validate --strict packages/desktop/composer.json
          composer install --working-dir=packages/desktop --no-interaction --prefer-dist
          composer test --working-dir=packages/desktop
          composer analyse --working-dir=packages/desktop
      - name: Composer launcher
        run: |
          sh -n scripts/package-host.sh scripts/test-host-cache.sh
          php -l packages/desktop/bin/pam-desktop
          scripts/test-host-cache.sh
      - name: The counter example opens a window
        run: |
          composer install --no-interaction --prefer-dist
          cargo build --locked -p pam-desktop-host
          xvfb-run -a sh -c '
            target/debug/pam-desktop run examples/counter &
            host=$!
            for attempt in $(seq 1 40); do
              xdotool search --name "PAM Desktop counter" >/dev/null 2>&1 && break
              sleep 0.5
            done
            status=0
            xdotool search --name "PAM Desktop counter" >/dev/null || status=1
            kill "$host"
            exit "$status"
          '
      - name: Host archive is reproducible
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "pam-desktop-host") | .version')
          scripts/package-host.sh target/debug/pam-desktop "${RUNNER_TEMP}/one" "${version}" x86_64-unknown-linux-gnu
          scripts/package-host.sh target/debug/pam-desktop "${RUNNER_TEMP}/two" "${version}" x86_64-unknown-linux-gnu
          cmp "${RUNNER_TEMP}"/one/*.tar.gz "${RUNNER_TEMP}"/two/*.tar.gz

  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (AppKit)
            runner: macos-15
          - name: Windows (Win32)
            runner: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: sodium
          coverage: none
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked -p pam-desktop-host
      - name: PHP package
        run: php packages/desktop/tests/run.php
