name: CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
      - name: Verify the supported Rust toolchain
        run: rustc --version | grep -E '^rustc 1\.88\.'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --no-default-features --features gateway -- -D warnings
      - run: cargo test --locked --workspace --no-default-features --features gateway
      - name: Linux host archive contract
        run: |
          sh -n scripts/package-host-linux.sh scripts/test-host-archive.sh scripts/test-host-cache.sh scripts/host-reproducibility-evidence.sh scripts/test-host-reproducibility-evidence.sh scripts/desktop-footprint-evidence.sh scripts/test-desktop-footprint-evidence.sh scripts/clean-room-desktop.sh
          php -l packages/desktop/bin/pam-desktop
          test -x packages/desktop/bin/pam-desktop
          scripts/test-host-cache.sh
          scripts/test-host-reproducibility-evidence.sh
          scripts/test-desktop-footprint-evidence.sh
          cargo build --locked -p pam-desktop --no-default-features --features gateway --bins
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "pam-desktop") | .version')
          mkdir -p "${RUNNER_TEMP}/host-one" "${RUNNER_TEMP}/host-two"
          SOURCE_DATE_EPOCH=0 scripts/package-host-linux.sh target/debug "${RUNNER_TEMP}/host-one" "${version}"
          SOURCE_DATE_EPOCH=0 scripts/package-host-linux.sh target/debug "${RUNNER_TEMP}/host-two" "${version}"
          PAM_EVIDENCE_REVISION="${GITHUB_SHA}" SOURCE_DATE_EPOCH=0 \
            scripts/host-reproducibility-evidence.sh create \
            "${RUNNER_TEMP}/host-one/pam-desktop-${version}-x86_64-unknown-linux-gnu.tar.gz" \
            "${RUNNER_TEMP}/host-two/pam-desktop-${version}-x86_64-unknown-linux-gnu.tar.gz" \
            "${RUNNER_TEMP}/host-evidence/evidence-manifest.json"
          scripts/host-reproducibility-evidence.sh verify \
            "${RUNNER_TEMP}/host-one/pam-desktop-${version}-x86_64-unknown-linux-gnu.tar.gz" \
            "${RUNNER_TEMP}/host-evidence/evidence-manifest.json"
          PAM_EVIDENCE_REVISION="${GITHUB_SHA}" \
            scripts/desktop-footprint-evidence.sh create \
            "${RUNNER_TEMP}/host-one/pam-desktop-${version}-x86_64-unknown-linux-gnu.tar.gz" \
            "${RUNNER_TEMP}/host-evidence/footprint-manifest.json"
          scripts/desktop-footprint-evidence.sh verify \
            "${RUNNER_TEMP}/host-one/pam-desktop-${version}-x86_64-unknown-linux-gnu.tar.gz" \
            "${RUNNER_TEMP}/host-evidence/footprint-manifest.json"
          scripts/test-host-archive.sh \
            "${RUNNER_TEMP}/host-one/pam-desktop-${version}-x86_64-unknown-linux-gnu.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: pam-desktop-reproducibility-${{ github.sha }}
          path: ${{ runner.temp }}/host-evidence/*.json
          if-no-files-found: error
          retention-days: 14
      - run: composer validate --strict composer.json
      - run: composer install --working-dir=packages/desktop --no-interaction --prefer-dist
      - run: composer validate --strict packages/desktop/composer.json
      - run: composer test --working-dir=packages/desktop
      - run: composer analyse --working-dir=packages/desktop
      - run: php scripts/test-release-workflows.php
      - name: Validate native platform evidence contracts
        run: >-
          python3 -m unittest
          tests/test_desktop_platform_evidence.py
          tests/test_desktop_performance_evidence.py
          tests/test_host_portable.py
      - name: Remove build intermediates
        if: always()
        run: cargo clean

  otlp-collector:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Verify the supported Rust toolchain
        run: rustc --version | grep -E '^rustc 1\.88\.'
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify official Collector image signature
        run: |
          cosign verify \
            --certificate-identity='https://github.com/open-telemetry/opentelemetry-collector-releases/.github/workflows/base-release.yaml@refs/tags/v0.157.0' \
            --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
            'ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector:0.157.0@sha256:4019ce4d7e7791a1a255fffb2f407af66d5017cc65543469ba565c4f47f795b8'
      - name: Certify Desktop OTLP interoperability
        run: scripts/certify-desktop-otlp.sh
      - name: Remove build intermediates
        if: always()
        run: cargo clean
