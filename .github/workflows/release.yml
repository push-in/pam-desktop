name: Release host

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  native-changes:
    name: Detect native host changes
    runs-on: ubuntu-22.04
    outputs:
      rebuild: ${{ steps.native.outputs.rebuild }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: native
        name: Compare with the previous release
        shell: bash
        run: |
          previous_tag=$(git tag --merged "${GITHUB_SHA}^" --sort=-version:refname | head -n 1)
          if [ -z "${previous_tag}" ]; then
            echo "rebuild=true" >> "${GITHUB_OUTPUT}"
          elif git diff --quiet "${previous_tag}" "${GITHUB_SHA}" -- \
            Cargo.toml Cargo.lock crates compat/rust-plugin-v1 \
            scripts/package-host-linux.sh scripts/test-host-archive.sh \
            .github/workflows/release.yml; then
            echo "rebuild=false" >> "${GITHUB_OUTPUT}"
          else
            echo "rebuild=true" >> "${GITHUB_OUTPUT}"
          fi

  build:
    needs: native-changes
    if: needs.native-changes.outputs.rebuild == 'true'
    name: x86_64-unknown-linux-gnu
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pam-desktop-release
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - name: Validate the public Composer package
        run: composer validate --strict composer.json
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq libfontconfig1-dev pkg-config
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/llvm.sh" \
            https://apt.llvm.org/llvm.sh
          chmod 0755 "${RUNNER_TEMP}/llvm.sh"
          sudo "${RUNNER_TEMP}/llvm.sh" 18
          sudo apt-get install -y libclang-18-dev
          echo "/usr/lib/llvm-18/bin" >> "${GITHUB_PATH}"
      - name: Build production host
        env:
          CC: clang-18
          CXX: clang++-18
          CLANG_PATH: /usr/bin/clang-18
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: |
          clang --version
          case "$(clang -print-resource-dir)" in
            /usr/lib/llvm-18/lib/clang/*) ;;
            *) exit 1 ;;
          esac
          cargo build --locked --release -p pam-desktop
      - name: Package and verify reproducible Linux host
        run: |
          version=${GITHUB_REF_NAME#v}
          source_epoch=$(git log -1 --format=%ct)
          mkdir -p dist verification
          SOURCE_DATE_EPOCH="${source_epoch}" scripts/package-host-linux.sh \
            target/release \
            dist \
            "${version}"
          SOURCE_DATE_EPOCH="${source_epoch}" scripts/package-host-linux.sh \
            target/release \
            verification \
            "${version}"
          cmp \
            "dist/pam-desktop-${version}-x86_64-unknown-linux-gnu.tar.gz" \
            "verification/pam-desktop-${version}-x86_64-unknown-linux-gnu.tar.gz"
          scripts/test-host-archive.sh \
            "dist/pam-desktop-${version}-x86_64-unknown-linux-gnu.tar.gz"
      - name: Attest reproducible Linux host archive
        uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: pam-desktop-x86_64-unknown-linux-gnu
          path: dist/pam-desktop-*
          if-no-files-found: error

  publish:
    needs:
      - native-changes
      - build
    if: always() && needs.native-changes.outputs.rebuild == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  publish-api:
    needs: native-changes
    if: needs.native-changes.outputs.rebuild == 'false'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish API-only release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          --repo "${GITHUB_REPOSITORY}"
          --generate-notes
          --verify-tag
