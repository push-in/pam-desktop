name: Release host

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: x86_64-unknown-linux-gnu
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          target: x86_64-unknown-linux-gnu
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev libfontconfig1-dev pkg-config
      - name: Build production host
        run: cargo build --locked --release -p pam-desktop --target x86_64-unknown-linux-gnu
      - name: Package Linux host
        run: |
          mkdir -p staging
          cp target/x86_64-unknown-linux-gnu/release/pam-desktop staging/
          cp target/x86_64-unknown-linux-gnu/release/pam-desktop-launcher staging/
          tar -C staging -czf pam-desktop-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: pam-desktop-x86_64-unknown-linux-gnu
          path: pam-desktop-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
