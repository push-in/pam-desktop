name: Release host

# A tag vX.Y.Z builds the host for every platform and attaches the archives
# the Composer launcher downloads (pam-desktop-X.Y.Z-<target>.tar.gz and
# their .sha256) to the GitHub release of the tag.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  version:
    name: The tag matches the sources
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          launcher_version=$(sed -n "s/^const HOST_VERSION = '\([^']*\)';$/\1/p" packages/desktop/bin/pam-desktop)
          [ "${version}" = "${cargo_version}" ] || { echo "Cargo.toml says ${cargo_version}, the tag says ${version}"; exit 1; }
          [ "${version}" = "${launcher_version}" ] || { echo "The launcher says ${launcher_version}, the tag says ${version}"; exit 1; }
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  build:
    name: ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux hosts are built on the oldest supported system (glibc 2.35,
          # GTK 4.6) and use newer GTK functions when they are installed.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            binary: pam-desktop
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            binary: pam-desktop
          - target: aarch64-apple-darwin
            runner: macos-15
            binary: pam-desktop
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            binary: pam-desktop
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            binary: pam-desktop.exe
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            binary: pam-desktop.exe
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install GTK 4
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev
      - name: Build the host
        run: cargo build --locked --release -p pam-desktop-host --target ${{ matrix.target }}
      - name: The host runs on glibc 2.35
        if: runner.os == 'Linux'
        run: scripts/check-glibc.sh "target/${{ matrix.target }}/release/${{ matrix.binary }}" 2.35
      - name: Pack the host
        shell: bash
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) scripts/package-host.sh \
            "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist \
            "${{ needs.version.outputs.version }}" "${{ matrix.target }}"
      - uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: pam-desktop-${{ matrix.target }}
          path: dist/pam-desktop-*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish the release
    needs: [checks, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/pam-desktop-*.tar.gz
            dist/pam-desktop-*.tar.gz.sha256
