[package]
name = "pam-desktop-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true

[lib]
path = "src/lib.rs"

[features]
# C ABI used by embedders that do not link the engine as a Rust crate.
ffi = []

[dependencies]
pam-desktop-wire.workspace = true
ttf-parser = { version = "0.25.1", default-features = false, features = ["std", "variable-fonts"] }

[lints]
workspace = true

