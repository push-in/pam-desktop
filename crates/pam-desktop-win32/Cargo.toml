[package]
name = "pam-desktop-win32"
description = "Win32 backend of PAM Desktop (Windows 10 1809+ and 11): Direct2D, DirectWrite, Media Foundation, WebView2."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
pam-desktop-ui.workspace = true
webview2-com = { version = "0.39", optional = true }
windows-core = "0.62"
windows-numerics = "0.3"
windows-collections = "0.3"
windows-future = "0.3"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62"
features = [
    "ApplicationModel_DataTransfer",
    "Foundation_Collections",
    "Storage",
    "Storage_Streams",
    "Data_Xml_Dom",
    "Foundation",
    "Foundation_Numerics",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Imaging_D2D",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Controls_RichEdit",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Touch",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

[features]
default = ["webview"]
# Embedded web pages through WebView2 (the Evergreen runtime of Edge).
webview = ["dep:webview2-com"]

[lints]
workspace = true
