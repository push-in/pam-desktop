[package]
name = "pam-desktop"
description = "Servo host, secure local bridge, and supervised PHP worker for Pam Desktop."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pam-desktop"
path = "src/main.rs"

[features]
default = ["servo-engine"]
gateway = []
servo-engine = [
    "gateway",
    "dep:euclid",
    "dep:mozjs",
    "dep:primeorder",
    "dep:rustls",
    "dep:servo",
    "dep:tracing",
    "dep:url",
]

[dependencies]
arboard.workspace = true
axum.workspace = true
cap-std.workspace = true
ed25519-dalek.workspace = true
euclid = { workspace = true, optional = true }
getrandom.workspace = true
global-hotkey.workspace = true
# Compatibility pins for Servo 0.4; see the workspace manifest.
mozjs = { workspace = true, optional = true }
pam-desktop-protocol.workspace = true
primeorder = { workspace = true, optional = true }
notify-rust.workspace = true
rfd.workspace = true
rustls = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
servo = { workspace = true, optional = true }
tokio.workspace = true
tracing = { workspace = true, optional = true }
ureq.workspace = true
url = { workspace = true, optional = true }
winit.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ksni.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon.workspace = true

[lints]
workspace = true
