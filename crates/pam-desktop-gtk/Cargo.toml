[package]
name = "pam-desktop-gtk"
description = "GTK 4 backend of PAM Desktop (Linux)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
pam-desktop-ui.workspace = true
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
libc = "0.2"
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"], optional = true }
async-channel = "2"
x11rb = "0.14"

[features]
default = ["tray", "hotkeys"]
# The tray icon, as a StatusNotifierItem on the session bus.
tray = ["dep:ksni"]
# Global shortcuts: X11 key grabs, or the desktop portal on Wayland.
hotkeys = []

[lints]
workspace = true
