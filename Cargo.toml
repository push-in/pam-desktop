[workspace]
members = [
    "crates/pam-desktop-wire",
    "crates/pam-desktop-engine",
]
exclude = ["legacy"]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.88"
authors = ["Pushin <engineering@pushin.com.br>"]
license = "MIT"
repository = "https://github.com/push-in/pam-desktop"

[workspace.dependencies]
pam-desktop-wire = { path = "crates/pam-desktop-wire" }
pam-desktop-engine = { path = "crates/pam-desktop-engine" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
overflow-checks = false
panic = "abort"
strip = "symbols"

[profile.performance]
inherits = "release"
debug = "line-tables-only"
strip = "none"
